server:
  port: 8080

spring:
  application:
    name: gateway-server
  profiles:
    active: local
    group:
      docker: "kafka,topics"
  config:
    import: optional:configserver:http://localhost:8888
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/api/v1/users/**
          - id: learning-service
            uri: lb://learning-service
            predicates:
              - Path=/api/v1/learning/**
          - id: quiz-service
            uri: lb://quiz-service
            predicates:
              - Path=/api/v1/quiz/**
          - id: simulation-service
            uri: lb://simulation-service
            predicates:
              - Path=/api/v1/investments/**,/api/v1/holdings/**,/api/v1/trade-histories/**,/api/v1/analyses/**
          - id: season-service
            uri: lb://season-service
            predicates:
              - Path=/api/v1/seasons/**
          - id: achievement-service
            uri: lb://achievement-service
            predicates:
              - Path=/api/v1/achievements/**
          - id: ranking-service
            uri: lb://ranking-service
            predicates:
              - Path=/api/v1/rankings/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
